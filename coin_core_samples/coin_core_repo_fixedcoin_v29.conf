# =============================================================================
# coin_core_repo.conf - Fixedcoin v29
# =============================================================================
#
# Fixedcoin is a Bitcoin fork focused on fixed supply economics.
# Uses SHA-256d (same as Bitcoin) for Proof of Work hashing.
#
# Build system: CMake (like Bitcoin Core v28+)
# Libraries output to: build/lib/
#
# Repository: https://github.com/Fixed-Blockchain/fixedcoin
#
# =============================================================================

# Repository URL (required)
COIN_CORE_REPO_URL=https://github.com/Fixed-Blockchain/fixedcoin.git

# Branch/tag to checkout
COIN_CORE_BRANCH=v29

# Binary suffix - output will be named stratum-proxy_<suffix>
COIN_CORE_BINARY_SUFFIX=fixedcoin

# -----------------------------------------------------------------------------
# C++ Standard (COIN_CORE_CXX_STANDARD)
# -----------------------------------------------------------------------------
# Fixedcoin is based on modern Bitcoin Core, requires C++20
COIN_CORE_CXX_STANDARD=20

# -----------------------------------------------------------------------------
# Hash Function (COIN_CORE_HASH_FUNCTION)
# -----------------------------------------------------------------------------
# Fixedcoin uses GetHash() (same as Bitcoin Core).
COIN_CORE_HASH_FUNCTION=GetHash

# -----------------------------------------------------------------------------
# Library Location (COIN_CORE_LIB_DIR)
# -----------------------------------------------------------------------------
# Fixedcoin uses CMake - libraries are in build/lib/ after build
COIN_CORE_LIB_DIR=build/lib

# -----------------------------------------------------------------------------
# Library Prefix (COIN_CORE_LIB_PREFIX)
# -----------------------------------------------------------------------------
# Fixedcoin libraries are named libfixedcoin_*.a
COIN_CORE_LIB_PREFIX=fixedcoin

# -----------------------------------------------------------------------------
# Configure Options
# -----------------------------------------------------------------------------
COIN_CORE_CONFIGURE_OPTS=--disable-wallet --disable-tests --disable-bench --disable-zmq --without-gui --with-daemon=no --with-utils=no

# -----------------------------------------------------------------------------
# Extra Include Paths (COIN_CORE_EXTRA_INCLUDES)
# -----------------------------------------------------------------------------
# Fixedcoin has standard header structure - no extra includes needed.
COIN_CORE_EXTRA_INCLUDES=

# -----------------------------------------------------------------------------
# Extra Library Directories (COIN_CORE_EXTRA_LIB_DIRS)
COIN_CORE_EXTRA_LIB_DIRS=

# Extra Libraries (COIN_CORE_EXTRA_LIBS)
# -----------------------------------------------------------------------------
# Fixedcoin doesn't require extra libraries beyond the standard set.
COIN_CORE_EXTRA_LIBS=
