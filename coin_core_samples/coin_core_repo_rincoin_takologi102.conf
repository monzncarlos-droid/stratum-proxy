# =============================================================================
# coin_core_repo.conf - Rincoin Core (takologi fork v1.0.2)
# =============================================================================
#
# Rincoin is a Litecoin fork with MWEB (MimbleWimble Extension Blocks) support
# and a custom PoW algorithm called RinHash.
#
# RinHash Algorithm: BLAKE3 → Argon2d → SHA3-256
# - Memory-hard (Argon2d) to resist ASIC mining
# - Uses modern cryptographic primitives
#
# Repository: https://github.com/takologi/rincoin
# Build system: Autotools (./autogen.sh && ./configure && make)
#
# =============================================================================

# Repository URL (required)
COIN_CORE_REPO_URL=https://github.com/takologi/rincoin.git

# Branch/tag to checkout
COIN_CORE_BRANCH=release-v1.0.2

# Binary suffix - output will be named stratum-proxy_<suffix>
COIN_CORE_BINARY_SUFFIX=rincoin

# -----------------------------------------------------------------------------
# C++ Standard (COIN_CORE_CXX_STANDARD)
# -----------------------------------------------------------------------------
# Rincoin uses older allocator traits removed in C++20, so requires C++17.
COIN_CORE_CXX_STANDARD=17

# -----------------------------------------------------------------------------
# Hash Function (COIN_CORE_HASH_FUNCTION)
# -----------------------------------------------------------------------------
# Rincoin uses GetPoWHash() which internally calls the RinHash algorithm.
COIN_CORE_HASH_FUNCTION=GetPoWHash

# -----------------------------------------------------------------------------
# Library Location (COIN_CORE_LIB_DIR)
# -----------------------------------------------------------------------------
# Rincoin uses autotools - libraries are in src/.libs/ after build
COIN_CORE_LIB_DIR=src/.libs

# -----------------------------------------------------------------------------
# Library Prefix (COIN_CORE_LIB_PREFIX)
# -----------------------------------------------------------------------------
# Rincoin builds libbitcoinconsensus.a (standard Bitcoin naming)
COIN_CORE_LIB_PREFIX=bitcoin

# -----------------------------------------------------------------------------
# Configure Options
# -----------------------------------------------------------------------------
COIN_CORE_CONFIGURE_OPTS=--disable-wallet --disable-tests --disable-bench --disable-zmq --without-gui --with-daemon=no --with-utils=no

# -----------------------------------------------------------------------------
# Extra Include Paths (COIN_CORE_EXTRA_INCLUDES)
# -----------------------------------------------------------------------------
# Rincoin includes MWEB headers in a non-standard location.
# Without this: fatal error: mw/models/crypto/Hash.h: No such file or directory
COIN_CORE_EXTRA_INCLUDES=libmw/include

# -----------------------------------------------------------------------------
# Extra Library Directories (COIN_CORE_EXTRA_LIB_DIRS)
# -----------------------------------------------------------------------------
# Additional directories to search for extra libraries.
# Rincoin has Argon2 in src/crypto/argon2/ and secp256k1-zkp in src/secp256k1-zkp/.libs/
COIN_CORE_EXTRA_LIB_DIRS=src/crypto/argon2 src/secp256k1-zkp/.libs src

# -----------------------------------------------------------------------------
# Extra Libraries (COIN_CORE_EXTRA_LIBS)
# -----------------------------------------------------------------------------
# Rincoin requires Argon2 libraries (with HW acceleration variants) and secp256k1-zkp.
# RinHash uses Argon2d which provides ASIC resistance through memory-hardness.
COIN_CORE_EXTRA_LIBS=bitcoin_util argon2 argon2_avx2 argon2_avx512 argon2_ssse3 secp256k1
