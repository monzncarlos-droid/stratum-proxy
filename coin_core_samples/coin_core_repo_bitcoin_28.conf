# =============================================================================
# coin_core_repo.conf - Bitcoin Core v28.0
# =============================================================================
#
# Bitcoin Core is the reference implementation of the Bitcoin protocol.
# Uses SHA-256d (double SHA-256) for Proof of Work hashing.
#
# Bitcoin Core v28+ has significant architectural changes:
# - Requires C++20 (uses std::endian, concepts, consteval)
# - Uses CMake build system (not autotools)
# - Crypto libraries split by CPU feature (sse41, avx2, x86_shani)
# - No GetPoWHash() method - uses GetHash() directly
#
# Repository: https://github.com/bitcoin/bitcoin (official)
#
# =============================================================================

# Repository URL (required)
COIN_CORE_REPO_URL=https://github.com/bitcoin/bitcoin.git

# Branch/tag to checkout
COIN_CORE_BRANCH=v28.0

# Binary suffix - output will be named stratum-proxy_<suffix>
COIN_CORE_BINARY_SUFFIX=bitcoin28

# -----------------------------------------------------------------------------
# C++ Standard (COIN_CORE_CXX_STANDARD)
# -----------------------------------------------------------------------------
# Bitcoin Core v28+ requires C++20 (uses std::endian, concepts, consteval)
COIN_CORE_CXX_STANDARD=20

# -----------------------------------------------------------------------------
# Hash Function (COIN_CORE_HASH_FUNCTION)
# -----------------------------------------------------------------------------
# The method name on CBlockHeader that computes the Proof-of-Work hash.
# Bitcoin Core uses GetHash() which computes SHA256d.
COIN_CORE_HASH_FUNCTION=GetHash

# -----------------------------------------------------------------------------
# Library Location (COIN_CORE_LIB_DIR)
# -----------------------------------------------------------------------------
# Relative path from coin_core/ to the directory containing .a library files.
# Bitcoin Core v28 uses CMake and outputs to build/lib/
COIN_CORE_LIB_DIR=build/lib

# -----------------------------------------------------------------------------
# Library Prefix (COIN_CORE_LIB_PREFIX)
# -----------------------------------------------------------------------------
# The prefix used for library names (e.g., "bitcoin" for libbitcoin_consensus.a)
COIN_CORE_LIB_PREFIX=bitcoin

# -----------------------------------------------------------------------------
# Configure Options
# -----------------------------------------------------------------------------
COIN_CORE_CONFIGURE_OPTS=--disable-wallet --disable-tests --disable-bench --disable-zmq --without-gui --with-daemon=no --with-utils=no

# -----------------------------------------------------------------------------
# Extra Include Paths (COIN_CORE_EXTRA_INCLUDES)
# -----------------------------------------------------------------------------
# Bitcoin Core v28 has a clean header structure - no extra includes needed.
COIN_CORE_EXTRA_INCLUDES=

# -----------------------------------------------------------------------------
# Extra Library Directories (COIN_CORE_EXTRA_LIB_DIRS)
COIN_CORE_EXTRA_LIB_DIRS=

# Extra Libraries (COIN_CORE_EXTRA_LIBS)
# -----------------------------------------------------------------------------
# Bitcoin Core doesn't require extra libraries beyond the standard set.
COIN_CORE_EXTRA_LIBS=
