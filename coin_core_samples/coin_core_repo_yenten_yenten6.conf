# coin_core_repo.conf - Yenten (yenten-6 branch)
#
# Yenten is a CPU-mineable cryptocurrency using YescryptR16 PoW algorithm.
# Based on older Bitcoin Core (C++11), requires C++17 for stratum-proxy.
#
# Website: https://yentencoin.org/
# Algorithm: YescryptR16

# Repository URL
COIN_CORE_REPO_URL=https://github.com/yentencoin/yenten.git

# Branch/tag to checkout
COIN_CORE_BRANCH=yenten-6

# Binary suffix - output will be named stratum-proxy_<suffix>
COIN_CORE_BINARY_SUFFIX=yenten

# C++ standard - Yenten is based on older Bitcoin Core, needs C++17
COIN_CORE_CXX_STANDARD=17

# Hash function name - GetPoWHash for YescryptR16
COIN_CORE_HASH_FUNCTION=GetPoWHash

# Library directory - autotools builds put libs in src/.libs/
COIN_CORE_LIB_DIR=src/.libs

# Library name prefix - uses standard "bitcoin" naming
COIN_CORE_LIB_PREFIX=bitcoin

# Configure options
COIN_CORE_CONFIGURE_OPTS=--disable-wallet --disable-tests --disable-bench --disable-zmq --without-gui --with-daemon=no --with-utils=no

# Extra include paths (none needed)
COIN_CORE_EXTRA_INCLUDES=

# Extra library directories (none needed)
COIN_CORE_EXTRA_LIB_DIRS=

# Extra libraries to link (none needed)
COIN_CORE_EXTRA_LIBS=

# -----------------------------------------------------------------------------
# Header Byte Ordering (for stratum protocol compatibility)
# -----------------------------------------------------------------------------
# Different PoW algorithms have different byte ordering conventions for the
# block header fields when receiving from stratum protocol.
#
# COIN_CORE_SWAP_PREVHASH: Swap 4-byte words in prevhash (true/false)
#   - true:  For Scrypt-like coins, YesPower
#   - false: For SHA256d
#
# COIN_CORE_SWAP_MERKLE: Swap 4-byte words in merkle root (true/false)
#   - true:  For SHA256d/Bitcoin
#   - false: For Scrypt-like coins, YesPower
#
# Yenten uses YesPower: swap_prevhash=true, swap_merkle=false
COIN_CORE_SWAP_PREVHASH=true
COIN_CORE_SWAP_MERKLE=false

# -----------------------------------------------------------------------------
# Difficulty Multiplier (from yiimp stratum/stratum.cpp g_algos[])
# -----------------------------------------------------------------------------
# This multiplier adjusts the base diff1 constant for different algorithms.
# The formula is: effective_diff1 = 0x0000ffff00000000 * diff_multiplier
#
# Common values from yiimp:
#   - 1       : SHA256d, blake, decred, etc.
#   - 0x100   : lyra2v2, lyra2v3, groestl, x11, x13, x16r, etc.
#   - 0x10000 : yespower, yescrypt, neoscrypt, argon2d, etc.
#
# Yenten uses YesPower algorithm
COIN_CORE_DIFF_MULTIPLIER=0x10000

# -----------------------------------------------------------------------------
# PoW Limit (consensus.powLimit from chainparams.cpp)
# -----------------------------------------------------------------------------
# The maximum target value for proof-of-work. This defines the minimum
# difficulty (difficulty 1). Used for share difficulty calculations.
#
# Copy this value from: consensus.powLimit = uint256S("...") in chainparams.cpp
# Use the mainnet value (from CMainParams class).
#
# Yenten mainnet powLimit (from yenten-6 branch)
COIN_CORE_POW_LIMIT=0x3fffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
