# coin_core_repo.conf - Yenten (yenten-6 branch)
#
# Yenten is a CPU-mineable cryptocurrency using YescryptR16 PoW algorithm.
# Based on older Bitcoin Core (C++11), requires C++17 for stratum-proxy.
#
# Website: https://yentencoin.org/
# Algorithm: YescryptR16

# Repository URL
COIN_CORE_REPO_URL=https://github.com/yentencoin/yenten.git

# Branch/tag to checkout
COIN_CORE_BRANCH=yenten-6

# Binary suffix - output will be named stratum-proxy_<suffix>
COIN_CORE_BINARY_SUFFIX=yenten

# C++ standard - Yenten is based on older Bitcoin Core, needs C++17
COIN_CORE_CXX_STANDARD=17

# Hash function name - GetPoWHash for YescryptR16
COIN_CORE_HASH_FUNCTION=GetPoWHash

# Library directory - autotools builds put libs in src/.libs/
COIN_CORE_LIB_DIR=src/.libs

# Library name prefix - uses standard "bitcoin" naming
COIN_CORE_LIB_PREFIX=bitcoin

# Configure options
COIN_CORE_CONFIGURE_OPTS=--disable-wallet --disable-tests --disable-bench --disable-zmq --without-gui --with-daemon=no --with-utils=no

# Extra include paths (none needed)
COIN_CORE_EXTRA_INCLUDES=

# Extra library directories (none needed)
COIN_CORE_EXTRA_LIB_DIRS=

# Extra libraries to link (none needed)
COIN_CORE_EXTRA_LIBS=
